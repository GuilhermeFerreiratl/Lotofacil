<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador Lotofácil 16 - Leve</title>
<style>
:root{--primary:#930089;--bg:#f4f6f9}body{font-family:Segoe UI;background:var(--bg);margin:0;padding:15px}.container{max-width:1400px;margin:0 auto}.card{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:15px}label{font-size:.8rem;font-weight:700;display:block;margin-top:6px}.row{display:flex;gap:5px}input{width:100%;padding:7px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}button{background:var(--primary);color:#fff;border:none;padding:12px;border-radius:4px;font-weight:bold;width:100%;margin-top:10px}.game-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;max-height:700px;overflow-y:auto}.game{border:1px solid #ddd;padding:8px;border-radius:6px}.balls{display:flex;flex-wrap:wrap;gap:3px}.ball{width:22px;height:22px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:bold}.info{font-size:.65rem;margin-top:4px;border-top:1px dashed #eee}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h3 style="color:#930089;margin:0 0 10px 0">Filtros 16 Números - SEU AJUSTE</h3>
<label>Soma 16 Min-Max:</label><div class="row"><input id="somaMin" type="number" value="200"><input id="somaMax" type="number" value="242"></div>
<label>Pares Min-Max:</label><div class="row"><input id="parMin" type="number" value="6"><input id="parMax" type="number" value="9"></div>
<label>Soma 1º+Último Min-Max:</label><div class="row"><input id="extMin" type="number" value="24"><input id="extMax" type="number" value="27"></div>
<label>Moldura (13) Min-Max:</label><div class="row"><input id="molMin" type="number" value="8"><input id="molMax" type="number" value="11"></div>
<label>Miolo (12) Min-Max:</label><div class="row"><input id="mioMin" type="number" value="5"><input id="mioMax" type="number" value="8"></div>
<label>Distância 1º ao Último Min-Max:</label><div class="row"><input id="distMin" type="number" value="20"><input id="distMax" type="number" value="24"></div>
<label>Último concurso:</label><input id="ultimo" type="text" value="1,2,3,4,5,6,7,12,15,16,17,19,21,22,23">
<label>Repetição Min-Max:</label><div class="row"><input id="repMin" type="number" value="9"><input id="repMax" type="number" value="11"></div>
<button onclick="gerar()">Gerar e Filtrar (LEVE)</button>
<div id="status" style="margin-top:10px;font-weight:bold;color:#930089"></div>
</div>
<div class="card"><h3>Resultados <span id="counter"></span></h3><div id="lista" class="game-list"></div></div>
</div>
<script>
const MOLDURA=[1,2,3,4,5,10,15,20,21,22,23,24,25];
const MIOLO=[6,7,8,9,11,12,13,14,16,17,18,19];
function parseUltimo(s){return s.split(/[\s,;]+/).map(Number).filter(n=>n>=1&&n<=25)}
function temSeq5(a){let c=1;for(let i=1;i<a.length;i++){if(a[i]==a[i-1]+1){c++;if(c>=5)return true}else c=1}return false}
async function gerar(){
  const status=document.getElementById('status'); const lista=document.getElementById('lista');
  lista.innerHTML=''; status.innerText='Gerando... pode levar 10s no celular';
  await new Promise(r=>setTimeout(r,100));
  let sMin=+somaMin.value, sMax=+somaMax.value, pMin=+parMin.value, pMax=+parMax.value;
  let eMin=+extMin.value, eMax=+extMax.value, moMin=+molMin.value, moMax=+molMax.value;
  let miMin=+mioMin.value, miMax=+mioMax.value, dMin=+distMin.value, dMax=+distMax.value;
  let rMin=+repMin.value, rMax=+repMax.value; let ultimo=parseUltimo(document.getElementById('ultimo').value);
  let filtrados=[]; let arr=Array.from({length:25},(_,i)=>i+1);
  let total=0;
  function rec(start,comb){
    if(comb.length===16){
      total++;
      if(total%200000===0) status.innerText=`Verificando... ${total.toLocaleString('pt-BR')} jogos | Achados: ${filtrados.length}`;
      if(temSeq5(comb)) return;
      let soma=comb.reduce((a,b)=>a+b,0); if(soma<sMin||soma>sMax) return;
      let pares=comb.filter(n=>n%2==0).length; if(pares<pMin||pares>pMax) return;
      let somaExt=comb[0]+comb[15]; if(somaExt<eMin||somaExt>eMax) return;
      let mol=comb.filter(n=>MOLDURA.includes(n)).length; if(mol<moMin||mol>moMax) return;
      let mio=comb.filter(n=>MIOLO.includes(n)).length; if(mio<miMin||mio>miMax) return;
      let dist=comb[15]-comb[0]; if(dist<dMin||dist>dMax) return;
      if(ultimo.length){let rep=comb.filter(n=>ultimo.includes(n)).length; if(rep<rMin||rep>rMax) return;}
      filtrados.push([...comb]);
      if(filtrados.length>=500){} // limite visual
      return;
    }
    for(let i=start;i<arr.length;i++){comb.push(arr[i]); rec(i+1,comb); comb.pop(); if(filtrados.length>2000) break;}
  }
  rec(0,[]);
  status.innerText=`Finalizado! ${total.toLocaleString('pt-BR')} verificados | ${filtrados.length.toLocaleString('pt-BR')} aprovados com SEU FILTRO`;
  document.getElementById('counter').innerText=`(${filtrados.length})`;
  let html='';
  for(let j=0;j<Math.min(200,filtrados.length);j++){
    let jogo=filtrados[j]; let balls=jogo.map(n=>`<div class=ball>${String(n).padStart(2,'0')}</div>`).join('');
    html+=`<div class=game><div class=balls>${balls}</div><div class=info>Soma:${jogo.reduce((a,b)=>a+b,0)} | Mol:${jogo.filter(n=>MOLDURA.includes(n)).length} Mio:${jogo.filter(n=>MIOLO.includes(n)).length} | D:${jogo[15]-jogo[0]}</div></div>`;
  }
  lista.innerHTML=html;
}
</script>
</body>
</html>
